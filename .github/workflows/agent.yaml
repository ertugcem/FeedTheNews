name: News Agent Runner

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Önceki taranan haberlerin geçmişini yükle
      - name: Restore Cache State
        uses: actions/cache/restore@v4
        with:
          path: seen_articles.json
          key: seen-articles-${{ github.run_id }}
          restore-keys: |
            seen-articles-

      # Ajanı çalıştır
      - name: Run News Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agent.py

      # Yeni taranan haberler listesini kaydet
      - name: Save Cache State
        uses: actions/cache/save@v4
        if: always()
        with:
          path: seen_articles.json
          key: seen-articles-${{ github.run_id }}
